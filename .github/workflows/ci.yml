name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed here. setup-gradle downloads and caches
      # the pinned Gradle distribution, so we invoke `gradle` (not ./gradlew).
      # Caching is on by default; `basic` is the open-source (MIT) provider over
      # actions/cache and works for public and private repos alike.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
          cache-provider: basic

      - name: Build and test
        run: gradle build

      - name: Run demo (seed + season end-to-end)
        run: gradle run -q
